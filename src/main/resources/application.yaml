spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/wtt
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: wtt-management-system
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis :
    type-aliases-package: com.wtt.demo.pojo
    mapper-locations: classpath:mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true

# AI模型配置
ai:
  # DeepSeek配置
  deepseek:
    api-url: https://api.deepseek.com/v1/chat/completions
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
  
  # Ollama本地配置
  ollama:
    api-url: http://localhost:11434/api/chat
    model: qwen3:8b