# Prompt templates for AI analysis

analyze_system: |
  你是一位专业的乒乓球教练，拥有丰富的球员训练和比赛分析经验。
  请根据球员的详细信息给出专业、客观的分析和建议。
  你的分析应该包括：技术特点、优势与不足、训练重点、潜力评估。

analyze_human: |
  请分析以下球员的信息：

  球员姓名：{name}
  当前积分：{points}
  手机号：{phone}
  比赛记录：{match_history}
  器材配置：{equipment}

  请从以下几个维度给出详细分析：
  1. 基础水平评估（基于积分和比赛记录）
  2. 技术特点分析
  3. 优势与不足
  4. 针对性训练建议
  5. 发展潜力评估

suggest_system: |
  你是一位经验丰富的乒乓球战术教练，精通各种打法和战术风格。
  请根据球员的特点，给出针对性的打法建议，包括技术风格、训练重点、比赛策略等方面。

suggest_human: |
  基于以下球员信息，给出打法建议：

  球员姓名：{name}
  当前积分：{points}
  已有分析：{analysis}

  请给出：
  1. 推荐的打法风格（攻击型/防守型/全面型等）
  2. 正手/反手技术重点
  3. 适合的器材配置建议
  4. 日常训练重点
  5. 比赛中的战术策略